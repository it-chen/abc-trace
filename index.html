<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:," />
    <title>123 ABC 描红练习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f6f8fb;
        --surface: #ffffff;
        --ink: #22304a;
        --ink-soft: #5b6b84;
        --line: #d7dee9;
        --grid-line: #b9c6d8;
        --guide: #f2b8b8;
        --guide-dot: #e5484d;
        --accent: #e5484d;
        --accent-ink: #ffffff;
        --teal: #0e9594;
        --tab-bg: #e8edf4;
        --chip-done: #fff3d6;
        --star: #f5b81e;
        --shadow: 0 10px 30px rgba(34, 48, 74, 0.10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12161f;
          --surface: #1c2230;
          --ink: #eef2f9;
          --ink-soft: #a7b3c7;
          --line: #333e52;
          --grid-line: #46536c;
          --guide: #6e4448;
          --guide-dot: #ff8589;
          --accent: #e5484d;
          --teal: #2bb3b1;
          --tab-bg: #262f42;
          --chip-done: #4a3d16;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
      .app {
        max-width: 860px;
        margin: 0 auto;
        padding: 12px 14px calc(18px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100%;
      }

      /* ---------- top bar: group tabs + star count ---------- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .tabs {
        display: flex;
        background: var(--tab-bg);
        border-radius: 999px;
        padding: 4px;
        gap: 4px;
        flex: 1 1 auto;
      }
      .tab {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-size: 19px;
        font-weight: 700;
        min-height: 52px;
        border-radius: 999px;
        padding: 6px 4px;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 2px 8px rgba(34, 48, 74, 0.15);
      }
      .tab .en { font-family: "Fredoka", sans-serif; font-weight: 600; letter-spacing: 0.04em; }
      .stars-box {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 8px 16px 8px 12px;
        min-height: 52px;
        font-family: "Fredoka", sans-serif;
        font-size: 22px;
        font-weight: 700;
      }
      .stars-box svg { width: 26px; height: 26px; flex: none; }

      /* ---------- character picker ---------- */
      .picker {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .pick {
        position: relative;
        min-width: 48px;
        min-height: 48px;
        padding: 4px 6px;
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 14px;
        font-family: "Fredoka", sans-serif;
        font-size: 24px;
        font-weight: 600;
        line-height: 1;
      }
      .pick[aria-current="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
      .pick .mini-star {
        position: absolute;
        top: -7px;
        right: -5px;
        width: 17px;
        height: 17px;
        display: none;
      }
      .pick.done { background: var(--chip-done); }
      .pick.done[aria-current="true"] { background: var(--accent); }
      .pick.done .mini-star { display: block; }

      /* ---------- stage ---------- */
      .stage-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .stage {
        position: relative;
        width: min(94vw, 500px);
        aspect-ratio: 100 / 112;
        max-height: 62vh;
        background: var(--surface);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      @media (min-aspect-ratio: 1/1) {
        .stage { width: auto; height: min(58vh, 560px); }
      }
      .stage svg.grid {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .guide-char {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        color: var(--guide);
        line-height: 1;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        transform: translateY(2%);
      }
      .stroke-dot {
        position: absolute;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--guide-dot);
        color: var(--guide-dot);
        font-family: "Fredoka", sans-serif;
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0.9;
        z-index: 3;
      }
      canvas.layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #drawCanvas { touch-action: none; z-index: 2; }
      .celebrate {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        background: color-mix(in srgb, var(--surface) 55%, transparent);
      }
      .celebrate.show { display: flex; }
      .celebrate .big-star { width: 110px; height: 110px; animation: pop 0.55s ease-out; filter: drop-shadow(0 6px 14px rgba(245, 184, 30, 0.45)); }
      .celebrate .cheer {
        font-size: 30px;
        font-weight: 700;
        color: var(--ink);
        animation: pop 0.55s ease-out;
      }
      .burst-star { position: absolute; width: 30px; height: 30px; animation: burst 1.1s ease-out forwards; }
      @keyframes pop {
        0% { transform: scale(0.3); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes burst {
        0% { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(160deg); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .celebrate .big-star, .celebrate .cheer { animation: none; }
        .burst-star { animation: none; opacity: 0; }
      }
      .caption {
        text-align: center;
        min-height: 34px;
      }
      .caption .word {
        font-family: "Fredoka", sans-serif;
        font-size: 26px;
        font-weight: 600;
      }
      .caption .hint {
        display: block;
        font-size: 14px;
        color: var(--ink-soft);
        margin-top: 2px;
      }

      /* ---------- controls ---------- */
      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .ctl {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 999px;
        min-height: 56px;
        padding: 8px 18px;
        font-size: 17px;
        font-weight: 700;
      }
      .ctl svg { width: 24px; height: 24px; flex: none; }
      .ctl:active { transform: scale(0.96); }
      .ctl.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .ctl.toggled {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .nav-btn { min-width: 118px; justify-content: center; }
      .colors { display: flex; gap: 9px; align-items: center; }
      .swatch {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid var(--surface);
        box-shadow: 0 0 0 2px var(--line);
        padding: 0;
      }
      .swatch[aria-pressed="true"] {
        box-shadow: 0 0 0 3px var(--ink);
        transform: scale(1.1);
      }
      .foot-note {
        text-align: center;
        font-size: 13px;
        color: var(--ink-soft);
        margin: 2px 0 0;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <div class="tabs" role="tablist" aria-label="练习分组">
          <button class="tab" role="tab" data-group="digits" aria-selected="true"><span class="en">123</span> 数字</button>
          <button class="tab" role="tab" data-group="upper" aria-selected="false"><span class="en">ABC</span> 大写</button>

          <span id="starCount">0</span>
        </div>
      </div>

      <div class="picker" id="picker" aria-label="选择要练习的字"></div>

      <div class="stage-wrap">
        <div class="stage" id="stage">
          <svg class="grid" viewBox="0 0 100 112" preserveAspectRatio="none" aria-hidden="true">
            <rect x="1" y="1" width="98" height="110" fill="none" stroke="var(--grid-line)" stroke-width="1.4" />
            <line x1="50" y1="1" x2="50" y2="111" stroke="var(--grid-line)" stroke-width="0.8" stroke-dasharray="4 3" />
            <line x1="1" y1="56" x2="99" y2="56" stroke="var(--grid-line)" stroke-width="0.8" stroke-dasharray="4 3" />
            <line x1="1" y1="1" x2="99" y2="111" stroke="var(--grid-line)" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.7" />
            <line x1="99" y1="1" x2="1" y2="111" stroke="var(--grid-line)" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.7" />
          </svg>
          <div class="guide-char" id="guideChar">1</div>
          <div id="dots"></div>
          <canvas class="layer" id="drawCanvas"></canvas>
          <div class="celebrate" id="celebrate" aria-hidden="true">
            <svg class="big-star" viewBox="0 0 24 24"><path fill="#f5b81e" stroke="#d99a06" stroke-width="0.7" d="M12 1.8l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L12 18.3l-6.5 3.4 1.3-7.2L1.5 9.4l7.3-1z"/></svg>
            <div class="cheer">太棒了！</div>
          </div>
        </div>
        <div class="caption">
          <span class="word" id="captionWord">1 · One</span>
          <span class="hint" id="captionHint"></span>
        </div>
      </div>

      <div class="controls">
        <div class="row">
          <button class="ctl nav-btn" id="prevBtn" aria-label="上一个">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
            上一个
          </button>
          <button class="ctl primary" id="speakBtn" aria-label="读一读">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.2 6a9 9 0 010 12"/></svg>
            读一读
          </button>
          <button class="ctl nav-btn" id="nextBtn" aria-label="下一个">
            下一个
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>
          </button>
        </div>
        <div class="row">
          <div class="colors" role="group" aria-label="画笔颜色" id="colors"></div>
          <button class="ctl" id="eraserBtn" aria-pressed="false" aria-label="橡皮">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L11 17H6.5l-3-3z"/><path d="M6.5 21h14"/></svg>
            橡皮
          </button>
          <button class="ctl" id="undoBtn" aria-label="撤销一笔">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a6 6 0 016 6v1"/></svg>
            撤销
          </button>
          <button class="ctl" id="clearBtn" aria-label="清除重写">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
            清除重写
          </button>
        </div>
      </div>

      <p class="foot-note">用手指或 Apple Pencil 在格子里照着浅红色的字描，跟着数字小圆点的顺序起笔。</p>
    </main>

      };
      var COLORS = [
        { name: "红色", value: "#e5484d" },
        { name: "蓝色", value: "#2f7de1" },
        { name: "绿色", value: "#35a852" },
        { name: "橙色", value: "#f08c1e" },
        { name: "紫色", value: "#8b5cf6" }
      ];

      /* ================= 状态 ================= */
      var state = {
        group: "digits",
        index: 0,
        color: COLORS[0].value,
        erasing: false,
        strokes: [],        // 本页已画：{color, erase, width(归一化), points:[[nx,ny],...]}
        done: {},           // 已完成的字（本次打开内）
        starTotal: 0,
        drawing: null
      };

      var stage = document.getElementById("stage");
      var guideChar = document.getElementById("guideChar");
      var dotsBox = document.getElementById("dots");
      var drawCanvas = document.getElementById("drawCanvas");
      var dctx = drawCanvas.getContext("2d");
      var picker = document.getElementById("picker");
      var captionWord = document.getElementById("captionWord");
      var captionHint = document.getElementById("captionHint");
      var celebrateEl = document.getElementById("celebrate");

      function currentChar() { return GROUPS[state.group][state.index]; }

      /* ================= 笔画展开 ================= */
      function expandStroke(stroke) {
        var pts = [];
        stroke.forEach(function (seg) {
          var kind = seg[0], i, x, y;
          if (kind === "p") {
            for (i = 1; i + 1 < seg.length; i += 2) pts.push([seg[i], seg[i + 1]]);
          } else if (kind === "a") {
            var cx = seg[1], cy = seg[2], rx = seg[3], ry = seg[4], a0 = seg[5], a1 = seg[6];
            var steps = Math.max(10, Math.ceil(Math.abs(a1 - a0) / 6));
            for (i = 0; i <= steps; i++) {
              var rad = (a0 + (a1 - a0) * (i / steps)) * Math.PI / 180;
              x = cx + rx * Math.cos(rad);
              y = cy + ry * Math.sin(rad);
              pts.push([x, y]);
            }
          } else if (kind === "d") {
            pts.push([seg[1], seg[2]]);
          }
        });
        // 去掉相邻重复点
        return pts.filter(function (p, i) {
          return i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1];
        });
      }
      function expandChar(ch) {
        return (STROKES[ch] || []).map(expandStroke);
      }

      /* ================= 界面构建 ================= */
      function buildPicker() {
        picker.innerHTML = "";
        GROUPS[state.group].forEach(function (ch, i) {
          var b = document.createElement("button");
          b.className = "pick" + (state.done[ch] ? " done" : "");
          b.textContent = ch;
          b.setAttribute("aria-current", i === state.index ? "true" : "false");
          b.setAttribute("aria-label", "练习 " + ch);
          var star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          star.setAttribute("viewBox", "0 0 24 24");
          star.setAttribute("class", "mini-star");
          star.innerHTML = '<path fill="#f5b81e" stroke="#d99a06" stroke-width="1" d="M12 1.8l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L12 18.3l-6.5 3.4 1.3-7.2L1.5 9.4l7.3-1z"/>';
          b.appendChild(star);
          b.addEventListener("click", function () { selectChar(i); });
          picker.appendChild(b);
        });
      }

      function buildDots(ch) {
        dotsBox.innerHTML = "";
        expandChar(ch).forEach(function (pts, i) {
          if (!pts.length) return;
          var d = document.createElement("div");
          d.className = "stroke-dot";
          d.textContent = String(i + 1);
          d.style.left = (pts[0][0]) + "%";
          d.style.top = (pts[0][1] / 112 * 100) + "%";
          dotsBox.appendChild(d);
        });
      }

      function buildColors() {
        var box = document.getElementById("colors");
        COLORS.forEach(function (c) {
          var b = document.createElement("button");
          b.className = "swatch";
          b.style.background = c.value;
          b.setAttribute("aria-label", c.name + "画笔");
          b.setAttribute("aria-pressed", state.color === c.value ? "true" : "false");
          b.addEventListener("click", function () {
            state.color = c.value;
            setErasing(false);
            Array.prototype.forEach.call(box.children, function (el) {
              el.setAttribute("aria-pressed", el === b ? "true" : "false");
            });
          });
          box.appendChild(b);
        });
      }

      /* ================= 画布 ================= */
      function fitCanvases() {
        var r = stage.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        drawCanvas.width = Math.round(r.width * dpr);
        drawCanvas.height = Math.round(r.height * dpr);
        guideChar.style.fontSize = Math.round(r.height * 0.74) + "px";
        redrawAll();
      }

      function brushWidth(erase) {
        var r = stage.getBoundingClientRect();
        return (erase ? 0.085 : 0.052) * r.width;
      }

      function drawStrokePath(ctx, pts, w, h) {
        if (!pts.length) return;
        ctx.beginPath();
        ctx.moveTo(pts[0][0] / 100 * w, pts[0][1] / 112 * h);
        if (pts.length === 1) {
          ctx.lineTo(pts[0][0] / 100 * w + 0.01, pts[0][1] / 112 * h);
        } else if (pts.length === 2) {
          ctx.lineTo(pts[1][0] / 100 * w, pts[1][1] / 112 * h);
        } else {
          for (var i = 1; i < pts.length - 1; i++) {
            var mx = (pts[i][0] + pts[i + 1][0]) / 2 / 100 * w;
            var my = (pts[i][1] + pts[i + 1][1]) / 2 / 112 * h;
            ctx.quadraticCurveTo(pts[i][0] / 100 * w, pts[i][1] / 112 * h, mx, my);
          }
          var last = pts[pts.length - 1];
          ctx.lineTo(last[0] / 100 * w, last[1] / 112 * h);
        }
        ctx.stroke();
      }

      function styleFor(ctx, s) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (s.erase) {
          ctx.globalCompositeOperation = "destination-out";
          ctx.strokeStyle = "rgba(0,0,0,1)";
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = s.color;
        }
        ctx.lineWidth = s.width;
      }

      function redrawAll() {
        var w = drawCanvas.width, h = drawCanvas.height;
        if (!w) return;
        dctx.clearRect(0, 0, w, h);
        state.strokes.forEach(function (s) {
          styleFor(dctx, s);
          dctx.lineWidth = s.widthNorm * w;
          drawStrokePath(dctx, s.points, w, h);
        });
        dctx.globalCompositeOperation = "source-over";
      }

      function eventPos(e) {
        var r = drawCanvas.getBoundingClientRect();
        return [
          (e.clientX - r.left) / r.width * 100,
          (e.clientY - r.top) / r.height * 112
        ];
      }

      drawCanvas.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        drawCanvas.setPointerCapture(e.pointerId);
        var w = drawCanvas.width;
        state.drawing = {
          color: state.color,
          erase: state.erasing,
          // 笔宽按画布像素宽归一化，尺寸变化时重绘不变形
          widthNorm: brushWidth(state.erasing) * (w / stage.getBoundingClientRect().width) / w,
          points: [eventPos(e)]
        };
        state.strokes.push(state.drawing);
        redrawAll();
      });
      drawCanvas.addEventListener("pointermove", function (e) {
        if (!state.drawing) return;
        e.preventDefault();
        var evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        evts.forEach(function (ev) { state.drawing.points.push(eventPos(ev)); });
        redrawAll();
      });
      function endStroke() {
        if (!state.drawing) return;
        state.drawing = null;
        checkComplete();
      }
      drawCanvas.addEventListener("pointerup", endStroke);
      drawCanvas.addEventListener("pointercancel", endStroke);
      drawCanvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      /* ================= 完成判定（宽松） ================= */
      var maskCache = {};
      function glyphMask(ch) {
        if (maskCache[ch]) return maskCache[ch];
        var mw = 150, mh = 168;
        var cv = document.createElement("canvas");
        cv.width = mw; cv.height = mh;
        var c = cv.getContext("2d");
        c.fillStyle = "#000";
        c.font = "600 128px Fredoka, sans-serif";
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText(ch, mw / 2, mh / 2 + 8);
        var data;
        try { data = c.getImageData(0, 0, mw, mh).data; } catch (err) { return null; }
        var ink = [];
        for (var y = 0; y < mh; y += 3) {
          for (var x = 0; x < mw; x += 3) {
            if (data[(y * mw + x) * 4 + 3] > 40) ink.push([x / mw, y / mh]);
          }
        }
        maskCache[ch] = { ink: ink };
        return maskCache[ch];
      }

      function coverage(ch) {
        if (!state.strokes.some(function (s) { return !s.erase; })) return 0;
        var mask = glyphMask(ch);
        if (!mask || !mask.ink.length) return 0;
        var w = drawCanvas.width, h = drawCanvas.height;
        var data;
        try { data = dctx.getImageData(0, 0, w, h).data; } catch (err) { return 0; }
        var hit = 0, r = Math.max(4, Math.round(w * 0.028));
        for (var i = 0; i < mask.ink.length; i++) {
          var cx = Math.round(mask.ink[i][0] * w), cy = Math.round(mask.ink[i][1] * h);
          var found = false;
          for (var dy = -r; dy <= r && !found; dy += 3) {
            for (var dx = -r; dx <= r && !found; dx += 3) {
              var px = cx + dx, py = cy + dy;
              if (px < 0 || py < 0 || px >= w || py >= h) continue;
              if (data[(py * w + px) * 4 + 3] > 30) found = true;
            }
          }
          if (found) hit++;
        }
        return hit / mask.ink.length;
      }

      function checkComplete() {
        var ch = currentChar();
        if (state.done[ch]) return;
        if (coverage(ch) >= 0.5) {
          state.done[ch] = true;
          state.starTotal++;
          document.getElementById("starCount").textContent = String(state.starTotal);
          buildPicker();
          celebrate(ch);
        }
      }

      /* ================= 鼓励：星星 + 朗读 + 轻响 ================= */
      var audioCtx = null;
      function chime() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          var t = audioCtx.currentTime;
          [523.25, 659.25, 783.99].forEach(function (f, i) {
            var o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = "sine"; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.16, t + i * 0.09 + 0.03);
            g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.35);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.4);
          });
        } catch (err) { /* 没有声音也没关系 */ }
      }

      function speak(text) {
        try {
          if (!("speechSynthesis" in window)) return;
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US";
          u.rate = 0.85;
          u.pitch = 1.1;
          window.speechSynthesis.speak(u);
        } catch (err) { /* 忽略 */ }
      }
      function speakChar(ch) {
        var w = WORDS[ch];
        if (w) speak(ch + "! " + w + "!");
        else speak(ch + "!");
      }

      function celebrate(ch) {
        chime();
        speakChar(ch);
        celebrateEl.classList.add("show");
        celebrateEl.setAttribute("aria-hidden", "false");
        // 小星星四散
        celebrateEl.querySelectorAll(".burst-star").forEach(function (el) { el.remove(); });
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce) {
          for (var i = 0; i < 8; i++) {
            var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            s.setAttribute("viewBox", "0 0 24 24");
            s.setAttribute("class", "burst-star");
            var ang = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
            var dist = 90 + Math.random() * 70;
            s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
            s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
            s.style.left = "calc(50% - 15px)";
            s.style.top = "38%";
            s.innerHTML = '<path fill="#f5b81e" d="M12 1.8l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L12 18.3l-6.5 3.4 1.3-7.2L1.5 9.4l7.3-1z"/>';
            celebrateEl.appendChild(s);
          }
        }
        setTimeout(function () {
          celebrateEl.classList.remove("show");
          celebrateEl.setAttribute("aria-hidden", "true");
        }, 1900);
      }

      /* ================= 切换 ================= */
      function selectChar(i) {
        state.index = (i + GROUPS[state.group].length) % GROUPS[state.group].length;
        state.strokes = [];
        state.drawing = null;
        var ch = currentChar();
        guideChar.textContent = ch;
        buildDots(ch);
        buildPicker();
        redrawAll();
        var w = WORDS[ch];
        captionWord.textContent = w ? (ch + " · " + w) : ch;
        var n = (STROKES[ch] || []).length;
        captionHint.textContent = "共 " + n + " 笔 · 跟着数字小圆点 1、2、3… 的顺序起笔";
      }

      function setErasing(on) {
        state.erasing = on;
        var b = document.getElementById("eraserBtn");
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.classList.toggle("toggled", on);
      }

      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", "false"); });
          tab.setAttribute("aria-selected", "true");
          state.group = tab.getAttribute("data-group");
          selectChar(0);
        });
      });
      document.getElementById("prevBtn").addEventListener("click", function () { selectChar(state.index - 1); });
      document.getElementById("nextBtn").addEventListener("click", function () { selectChar(state.index + 1); });
      document.getElementById("clearBtn").addEventListener("click", function () {
        state.strokes = [];
        var ch = currentChar();
        if (state.done[ch]) {
          state.done[ch] = false;
          state.starTotal = Math.max(0, state.starTotal - 1);
          document.getElementById("starCount").textContent = String(state.starTotal);
          buildPicker();
        }
        redrawAll();
      });
      document.getElementById("undoBtn").addEventListener("click", function () {
        state.strokes.pop();
        redrawAll();
      });
      document.getElementById("eraserBtn").addEventListener("click", function () { setErasing(!state.erasing); });
      document.getElementById("speakBtn").addEventListener("click", function () { speakChar(currentChar()); });

      /* ================= 启动 ================= */
      buildColors();
      selectChar(0);
      fitCanvases();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { maskCache = {}; fitCanvases(); });
      }
      var resizeTimer = null;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitCanvases, 120);
      });
    </script>
  </body>
</html>
